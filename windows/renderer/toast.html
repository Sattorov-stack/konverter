<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .card { margin: 4px; height: 76px; border-radius: 16px; background: rgba(34,34,38,.96); border: 1px solid rgba(255,255,255,.12);
    display: flex; align-items: center; gap: 12px; padding: 0 16px; color: #f2f2f4; }
  .ico { font-size: 22px; width: 26px; text-align: center; }
  .spin { width: 20px; height: 20px; border: 3px solid #55555d; border-top-color: #ff8a2b; border-radius: 50%; animation: s .8s linear infinite; margin: 0 3px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .txt { flex: 1; min-width: 0; }
  .title { font-weight: 600; }
  .detail { font-size: 12px; color: #a6a6ae; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  button { background: none; border: 0; color: #ff8a2b; font: inherit; font-weight: 600; cursor: pointer; }
</style></head>
<body>
<div class="card">
  <div class="ico" id="ico"></div>
  <div class="txt"><div class="title" id="title"></div><div class="detail" id="detail"></div></div>
  <button id="rev" hidden>Показать</button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $('rev').onclick = () => window.api.toastReveal();
  window.api.onToast((p) => {
    $('ico').innerHTML = p.state === 'working' ? '<div class="spin"></div>' : p.state === 'done' ? '✅' : '⚠️';
    $('title').textContent = p.title;
    $('detail').textContent = p.detail || '';
    $('rev').hidden = !p.reveal;
  });
</script></body></html>
