<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font-family: "Segoe UI", system-ui, sans-serif; }
  svg { display: block; width: 300px; height: 300px; }
  .back { fill: rgba(18,18,20,.55); }
  .seg path { fill: rgba(28,28,31,.88); stroke: rgba(255,255,255,.18); stroke-width: 1; transition: fill .08s; }
  .seg.hot path { fill: #ff8a2b; }
  .seg text { fill: #fff; text-anchor: middle; pointer-events: none; font-weight: 600; }
  .hole { fill: rgba(0,0,0,.35); stroke: rgba(255,255,255,.15); }
</style></head>
<body>
<svg id="svg" viewBox="0 0 300 300"></svg>
<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('svg');
const C = 150, INNER = 38;
let droppedPaths = [];

function pt(r, a) { return [C + r * Math.cos(a), C + r * Math.sin(a)]; }
function sector(i, n, ri, ro) {
  const step = 2 * Math.PI / n, gap = 0.035;
  const a0 = -Math.PI / 2 + i * step + gap, a1 = -Math.PI / 2 + (i + 1) * step - gap;
  const [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
  const big = (a1 - a0) > Math.PI ? 1 : 0;
  return `M${x0},${y0} A${ro},${ro} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${ri},${ri} 0 ${big} 0 ${x3},${y3} Z`;
}
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function build(items) {
  svg.innerHTML = '';
  const n = items.length, outer = n > 8 ? 134 : 122;
  el('circle', { class: 'back', cx: C, cy: C, r: outer + 8 }, svg);
  items.forEach((it, i) => {
    const g = el('g', { class: 'seg', 'data-id': it.id }, svg);
    el('path', { d: sector(i, n, INNER, outer) }, g);
    const mid = -Math.PI / 2 + (i + 0.5) * 2 * Math.PI / n;
    const [tx, ty] = pt((INNER + outer) / 2, mid);
    if (it.icon) {
      const ic = el('text', { x: tx, y: ty - 2, 'font-size': 17 }, g); ic.textContent = it.icon;
      const t = el('text', { x: tx, y: ty + 14, 'font-size': 10 }, g); t.textContent = it.title;
    } else {
      const t = el('text', { x: tx, y: ty + 4, 'font-size': 13 }, g); t.textContent = it.title;
    }
    const hot = (on) => g.classList.toggle('hot', on);
    g.addEventListener('dragenter', (e) => { e.preventDefault(); hot(true); });
    g.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; hot(true); });
    g.addEventListener('dragleave', () => hot(false));
    g.addEventListener('drop', (e) => {
      e.preventDefault(); hot(false);
      const paths = [...(e.dataTransfer.files || [])].map((f) => window.api.pathFor(f)).filter(Boolean);
      window.api.wheelPick(it.id, paths);
    });
  });
  el('circle', { class: 'hole', cx: C, cy: C, r: INNER - 4 }, svg);
}

window.api.onWheel(({ items }) => build(items));
</script></body></html>
