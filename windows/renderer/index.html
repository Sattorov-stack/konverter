<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Конвертер</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 6px; }
  header h1 { margin: 0; font-size: 16px; }
  main { flex: 1; overflow-y: auto; padding: 6px 20px 12px; display: flex; flex-direction: column; gap: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 18px; padding: 40px 20px; text-align: center; cursor: pointer; transition: .15s; }
  .drop.compact { padding: 14px; }
  .drop.over { border-color: var(--acc); background: rgba(255,138,43,.08); }
  .drop h2 { margin: 0 0 4px; font-size: 20px; } .drop.compact h2 { font-size: 14px; margin: 0; }
  .drop p { margin: 0; color: var(--sub); } .drop.compact p { display: none; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 34px 1fr auto 26px; gap: 12px; align-items: center; background: var(--card); border-radius: 12px; padding: 10px 12px; }
  .ico { font-size: 24px; text-align: center; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { color: var(--sub); font-size: 12px; margin-top: 2px; min-height: 16px; }
  .ok { color: var(--ok); font-weight: 600; } .err { color: var(--err); }
  .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .2s; }
  .bar.spin i { width: 35%; animation: slide 1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
  .x { background: none; border: 0; color: var(--sub); font-size: 18px; cursor: pointer; border-radius: 6px; }
  .x:hover { color: var(--text); background: var(--line); }
  footer { display: flex; align-items: center; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
  footer .grow { flex: 1; color: var(--sub); font-size: 12px; }
  .hint { color: var(--sub); font-size: 12px; padding: 0 20px 4px; }
</style></head>
<body>
<header><h1>Конвертер</h1><button class="btn" id="settings">Настройки</button></header>
<div class="hint">Совет: тащи файл из Проводника и нажми Shift, Alt или Ctrl: колесо появится прямо под курсором.</div>
<main>
  <div class="drop" id="drop"><h2>Перетащи файлы сюда</h2><p>Фото, музыка, видео и документы. Оригинал останется, новый файл появится рядом.</p></div>
  <div class="list" id="list"></div>
</main>
<footer id="foot" hidden>
  <label>Все в <select id="all"></select></label>
  <div class="grow" id="count"></div>
  <button class="btn" id="clear">Очистить</button>
  <button class="btn primary" id="go">Конвертировать</button>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const ICON = { image: '🖼️', audio: '🎵', video: '🎬', doc: '📄', sheet: '📊', slides: '📽️', pdf: '📕' };
const ALIAS = { jpeg: 'jpg', tif: 'tiff', htm: 'html', heif: 'heic', aif: 'aiff', mpeg: 'mpg' };
const norm = (e) => { e = e.toLowerCase(); return ALIAS[e] || e; };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let KINDS = {}, EXT = {}, DEFAULT = {}, files = [], busy = false, uid = 0;

const outsFor = (f) => KINDS[f.kind].out.filter((t) => t !== f.ext);

async function addPaths(paths) {
  const explicit = new Set(paths);
  const all = await window.api.expand(paths);
  const bad = [];
  for (const p of all) {
    if (files.some((f) => f.path === p)) continue;
    const name = p.split(/[\\/]/).pop();
    const ext = norm(name.includes('.') ? name.split('.').pop() : '');
    const kind = EXT[ext];
    if (!kind) { if (explicit.has(p)) bad.push(name); continue; }
    const f = { id: ++uid, path: p, name, ext, kind, status: 'idle', pct: 0 };
    const opts = outsFor(f);
    f.target = opts.includes(DEFAULT[kind]) ? DEFAULT[kind] : opts[0];
    files.push(f);
  }
  if (bad.length) alert('Этот формат пока не поддерживается:\n' + bad.join('\n'));
  render();
}

function rowHTML(f) {
  const opts = outsFor(f).map((t) => `<option value="${t}" ${t === f.target ? 'selected' : ''}>${t.toUpperCase()}</option>`).join('');
  let st;
  if (f.status === 'working') st = `<div class="bar ${f.pct ? '' : 'spin'}"><i style="width:${Math.round(f.pct * 100)}%"></i></div>`;
  else if (f.status === 'done') st = `<span class="ok">Готово</span> · <a class="link" data-reveal="${f.id}">Показать в папке</a>`;
  else if (f.status === 'error') st = `<span class="err">${esc(f.error)}</span>`;
  else st = f.ext.toUpperCase();
  return `<div class="row" data-id="${f.id}"><div class="ico">${ICON[f.kind]}</div>
    <div><div class="name" title="${esc(f.path)}">${esc(f.name)}</div><div class="status">${st}</div></div>
    <select data-sel="${f.id}" ${busy ? 'disabled' : ''}>${opts}</select>
    <button class="x" data-del="${f.id}" ${busy ? 'disabled' : ''} title="Убрать">×</button></div>`;
}

function render() {
  $('#list').innerHTML = files.map(rowHTML).join('');
  $('#drop').classList.toggle('compact', files.length > 0);
  $('#drop').querySelector('h2').textContent = files.length ? 'Добавить ещё файлы' : 'Перетащи файлы сюда';
  $('#foot').hidden = files.length === 0;
  const all = [...new Set(files.flatMap(outsFor))];
  const cur = $('#all').value;
  $('#all').innerHTML = '<option value="">выбрать…</option>' + all.map((t) => `<option value="${t}">${t.toUpperCase()}</option>`).join('');
  $('#all').value = all.includes(cur) ? cur : '';
  $('#all').disabled = busy;
  $('#count').textContent = `Файлов: ${files.length}`;
  $('#go').disabled = busy || !files.some((f) => f.status !== 'done');
  $('#go').textContent = busy ? 'Конвертирую…' : 'Конвертировать';
  $('#clear').disabled = busy;
}

async function convertAll() {
  busy = true; render();
  for (const f of files) {
    if (f.status === 'done') continue;
    f.status = 'working'; f.pct = 0; render();
    const r = await window.api.convert(f.path, f.target);
    if (r.ok) { f.status = 'done'; f.out = r.out; } else { f.status = 'error'; f.error = r.error; }
    render();
  }
  busy = false; render();
}

$('#list').addEventListener('change', (e) => {
  const id = e.target.dataset.sel; if (!id) return;
  const f = files.find((x) => x.id == id); f.target = e.target.value;
  if (f.status !== 'idle') { f.status = 'idle'; render(); }
});
$('#list').addEventListener('click', (e) => {
  const del = e.target.dataset.del, rev = e.target.dataset.reveal;
  if (del) { files = files.filter((f) => f.id != del); render(); }
  if (rev) { const f = files.find((x) => x.id == rev); if (f && f.out) window.api.reveal(f.out); }
});
$('#all').addEventListener('change', (e) => {
  const t = e.target.value; if (!t) return;
  files.forEach((f) => { if (outsFor(f).includes(t)) { f.target = t; if (f.status !== 'done') f.status = 'idle'; } });
  render();
});
$('#clear').onclick = () => { files = []; render(); };
$('#go').onclick = convertAll;
$('#settings').onclick = () => window.api.openSettings();
$('#drop').onclick = async () => addPaths(await window.api.pickFiles());

window.addEventListener('dragover', (e) => { e.preventDefault(); $('#drop').classList.add('over'); });
window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) $('#drop').classList.remove('over'); });
window.addEventListener('drop', (e) => {
  e.preventDefault(); $('#drop').classList.remove('over');
  addPaths([...e.dataTransfer.files].map((f) => window.api.pathFor(f)).filter(Boolean));
});
window.api.onProgress((file, p) => {
  const f = files.find((x) => x.path === file); if (!f) return;
  f.pct = p;
  const bar = document.querySelector(`[data-id="${f.id}"] .bar`);
  if (bar) { bar.classList.remove('spin'); bar.firstElementChild.style.width = Math.round(p * 100) + '%'; }
});

(async () => {
  const fm = await window.api.formats();
  KINDS = fm.KINDS; DEFAULT = fm.targets;
  for (const k in KINDS) KINDS[k].in.forEach((e) => { EXT[e] = k; });
  render();
})();
</script></body></html>
